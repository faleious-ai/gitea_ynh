# OpenAI MCP clients expect refresh-token capability to be explicit in the
# authorization-server discovery document. Gitea 1.27 issues refresh tokens
# for the authorization-code grant but omits offline_access from discovery.
# Proxy the canonical Gitea document and add that standard capability without
# changing the issuer or any OAuth endpoint.
location = __PATH__/.well-known/openid-configuration {
    proxy_pass http://127.0.0.1:__PORT__/.well-known/openid-configuration;
    include proxy_params_no_auth;
    proxy_set_header Accept-Encoding "";
    sub_filter_types application/json;
    sub_filter_once on;
    sub_filter '"groups"' '"groups", "offline_access"';
}

# RFC 8414 alias for clients that prefer OAuth Authorization Server Metadata
# over OpenID Connect Discovery. The payload remains the canonical Gitea
# discovery document with the explicit offline_access capability above.
location = __PATH__/.well-known/oauth-authorization-server {
    proxy_pass http://127.0.0.1:__PORT__/.well-known/openid-configuration;
    include proxy_params_no_auth;
    proxy_set_header Accept-Encoding "";
    sub_filter_types application/json;
    sub_filter_once on;
    sub_filter '"groups"' '"groups", "offline_access"';
}

#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {
#root_path_only  proxy_pass   http://127.0.0.1:__PORT__;
#sub_path_only   proxy_pass   http://127.0.0.1:__PORT__/;
    include         proxy_params_no_auth;
    proxy_buffering off;
    client_max_body_size 0;
}

# Used for container registry
# Note this is a fixed url
location /v2/ {
    proxy_pass       http://127.0.0.1:__PORT__;
    include          proxy_params_no_auth;
    proxy_buffering  off;
    client_max_body_size 0;
}
